name: Statespace
description: Record the image of this commit as a Statespace build, so the commit can run as an arm.
author: Statespace
branding:
  icon: git-commit
  color: purple
inputs:
  image:
    description: The image of this commit, by digest (such as ghcr.io/acme/web@sha256:<digest>) or by tag. The action resolves a tag to its digest with docker.
    required: true
  path:
    description: The folder of statespace.toml, relative to the root of the repository.
    default: "."
  app:
    description: The app that this build is for. Without it, the build is for every app of the repository and folder.
    default: ""
  api:
    description: The Statespace API.
    default: https://api.statespace.com
outputs:
  image:
    description: The image that Statespace recorded, by digest.
    value: ${{ steps.record.outputs.image }}
runs:
  using: composite
  steps:
    - name: Record the build
      id: record
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        FOLDER: ${{ inputs.path }}
        APP: ${{ inputs.app }}
        API: ${{ inputs.api }}
      run: '"$GITHUB_ACTION_PATH/record.sh"'
